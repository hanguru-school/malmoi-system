# 레거시: booking-system + Vercel 배포용 워크플로.
# MalMoi 포털 운영 배포는 deploy-main.yml(SSH)을 사용합니다.
# 자동 실행으로 포털 package.json과 충돌하므로 수동 실행만 허용합니다.

name: Deploy to Production (legacy / manual)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Note
        run: |
          echo "수동 워크플로입니다. Vercel 배포 단계는 저장소 시크릿·프로젝트에 맞게 별도 구성하세요."
