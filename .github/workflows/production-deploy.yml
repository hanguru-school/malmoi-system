# 브랜치 보호 규칙의 필수 체크 이름: production-deploy
# MalMoi 포털(malmoi-integrated) PR이 booking-system 시절 워크플로와 충돌하지 않도록
# «PR 헤드 커밋» 기준으로 npm ci + build 만 수행합니다.

name: Production Deployment

on:
  pull_request:
    branches:
      - main

concurrency:
  group: production-deploy-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  production-deploy:
    name: production-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Optional portal verify script
        env:
          CI_SKIP_HTTP_SMOKE: "1"
        run: |
          if [ -f scripts/ci-verify.mjs ]; then
            node scripts/ci-verify.mjs
          else
            echo "scripts/ci-verify.mjs 없음 — 스킵"
          fi

      - name: Status
        run: echo "✅ production-deploy 체크 완료 (PR head 기준)"
