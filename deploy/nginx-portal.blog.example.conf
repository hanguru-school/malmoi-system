# 예시: MalMoi 포털 전용 (portal.hanguru.blog 만 수신)
# 실제 경로는 서버 정책에 맞게 ssl_certificate 등을 조정하세요.
# portal.hanguru.school 은 server_name 에 포함하지 않습니다.

server {
    listen 443 ssl http2;
    server_name portal.hanguru.blog;

    # ssl_certificate     /etc/letsencrypt/live/portal.hanguru.blog/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/portal.hanguru.blog/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
