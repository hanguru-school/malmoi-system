# 자동 검수: db-check-update · main (PR·push)
# 운영 배포는 deploy-main.yml 에서만 수행합니다.

name: CI

on:
  push:
    branches: [main, db-check-update]
  pull_request:
    branches: [main, db-check-update]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: CI verify (docs, env examples, smoke)
        run: node scripts/ci-verify.mjs
