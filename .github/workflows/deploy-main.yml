# main 브랜치에 반영된 커밋만 원격 프로덕션 배포 (작업 브랜치 배포 없음)
# 수동 배포: Actions 「Deploy production (manual)」— deploy-production.yml

name: Deploy production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          MALMOI_REMOTE_DEPLOY_SCRIPT: ${{ secrets.MALMOI_REMOTE_DEPLOY_SCRIPT }}
        with:
          host: ${{ secrets.MALMOI_DEPLOY_HOST }}
          username: ${{ secrets.MALMOI_DEPLOY_USER }}
          key: ${{ secrets.MALMOI_DEPLOY_SSH_KEY }}
          envs: MALMOI_REMOTE_DEPLOY_SCRIPT
          script_stop: true
          script: |
            set -euo pipefail
            REMOTE_SCRIPT="${MALMOI_REMOTE_DEPLOY_SCRIPT:-/srv/malmoi/apps/malmoi-integrated/current/deploy/deploy-prod.sh}"
            echo "Running: bash $REMOTE_SCRIPT"
            bash "$REMOTE_SCRIPT"
